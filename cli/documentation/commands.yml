g:
  completions:
    description: Generate shell completions; defaults to zsh.
    shells:
      bash: Generate Bash completions.
      zsh: Generate Zsh completions.
      fish: Generate Fish completions.
  format: Format CLI Rust source with cargo fmt from any directory.
  front: Run ~/github.com/loicbourgois/gravitle/scripts/front.sh.
  test:
    description: Run CLI tests from any directory; defaults to all. Stream timestamped output to the terminal and cli/logs/terminal.log, retaining the latest 100 lines.
    all: Run both Rust and Python tests; fail if either suite fails.
    python: Run Python unittest discovery through uv.
    rust: Run Rust tests through cargo test.
  todo: Generate improvement proposals from a YAML specification.
  up: Run ~/github.com/loicbourgois/gravitle/scripts/up.sh.
  watch:
    description: Manage background CLI rebuilding and installation; defaults to start.
    start: Start the watcher unless it is already active.
    status: Report watcher status; exit 0 when active and 1 when inactive.
    stop: Stop the watcher and any active build/install process.
  wip: Run ~/github.com/loicbourgois/gravitle/cli/scripts/wip.sh
  moon:
    description: Run Moonlighter workflows.
    wip: Generate improvement proposals from ~/github.com/loicbourgois/gravitle/front/moonlighter/wip.yml.
  review:
    description: Review files using models, files, and rules from a YAML specification.
    specification: Required YAML path or unique filename prefix in ~/github.com/loicbourgois/gravitle/front/moonlighter/review; for example, g review 01.
    outputs: Save the review prompt and successful responses beside the specification using the same .t.p.md and .t.r.<short model name>.md filenames as todo.