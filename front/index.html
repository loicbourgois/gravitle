<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Gravitle - Chrono</title>
    <link rel="stylesheet" href="chrono/index.css">
  </head>
  <body>
    <div id="overlay">
      <div id="overlay-left">
        <a href="/alpha/">alpha</a>
        <a href="/">chrono</a>
        <a href="/duel/">duel</a>
        <a href="https://github.com/loicbourgois/gravitle">github</a>
        <!-- <a href="https://discord.gg/ejqGJkm7KM">discord</a> -->
        <div id="debug">
          <p id="frame_percent_budget"></p>
          <p id="debug_durations_engine"></p>
          <p id="debug_durations_draw"></p>
          <p id="debug_pairs"></p>
          <p id="debug_counts_pairs"></p>
          <p id="debug_counts_colliding"></p>
          <p id="debug_counts_colliding_physics"></p>
          <p id="debug_elapsed"></p>
        </div>
      </div>
      <span class="spacer"></span>
      <div id="overlay-right">
        <p id="fps"></p>
        <span class="spacer"></span>
      </div>
    </div>
    <div id="victory">
      <span class="spacer"></span>
      <div id="victory_main">
        
        <div id="notice_text_2">
          <span class="spacer"></span>
          <div id="notice_text_2_inner">
            <span id="notice_text_2_inner_1" class="direction">Welcome back Captain.</span>
            <span id="notice_text_2_inner_2" class="direction">Sector ...-. needs your help.</span>
            <span id="notice_text_2_inner_3" class="direction">All stars have been shut off.</span>
            <span id="notice_text_2_inner_4" class="direction">Please, bring the light back.</span>
            <span id="notice_text_2_inner_5" class="direction">Godspeed !</span>
          </div>
          <span class="spacer"></span>
        </div>
        <div id="notice_text">
          <span class="spacer"></span>
          <div id="left_key">
            <span class="direction">Left Thruster</span>
            <span class="key_interact">[s]</span>
          </div>
          <div id="right_key">
            <span class="direction">Right Thruster</span>
            <span class="key_interact">[d]</span>
          </div>
          <span class="spacer"></span>
        </div>
        <div id="durations">
          <p id="victory_duration_lower"></p>
          <p id="victory_duration"></p>
          <p id="victory_duration_higher"></p>
        </div>
        <div id="fuel_used">
          <p id="fuel_used_lower"></p>
          <p id="fuel_used_me"></p>
          <p id="fuel_used_higher"></p>
        </div>
        <span class="spacer"></span>
        <div id="vic_text_2" class="hide vic_text">
          <button id="share">
            <span class="vt">Share</span>
            <span id="share_1" class="key_interact">[c]</span>
            <span id="share_2" class="key_interact hide">Saved to clipboard</span>
          </button>
        </div>
        <div id="vic_text" class="hide vic_text">
          <button id="again">
            <span class="vt">Again</span>
            <span class="key_interact">[a]</span>
          </button>
          <button id="new">
            <span class="vt">New</span>
            <span class="key_interact">[space]</span>
          </button>
          <button id="mode">
            <span class="vt">Darkmode</span>
            <span class="key_interact">[m]</span>
          </button>
        </div>
      </div>
      <span class="ex"></span>
    </div>
    <div id="content">
      <div id="left"></div>
      <div id="center">
        <div id="top"></div>
        <canvas id="canvas">
        </canvas>
        <div id="bottom"></div>
      </div>
      <div id="right"></div>
    </div>
    <noscript>This page contains webassembly and javascript content, please enable javascript in your browser.</noscript>
    <script type="module" src="chrono/index.js"></script>
  </body>
</html>
